<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d1269">
<title>MyCycle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--accent:#7b1e87;--accent2:#a32db2;--pink:#ff5f91;--ink:#211827;--muted:#7e7380;--line:#efe1ec;--period:#ffc6da;--fertile:#ccefd3;--ovu:#b67bd4;--shadow:0 10px 28px #57165f14}
*{box-sizing:border-box} body{margin:0;background:#f7f3f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#shell{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#fffafd,#fff);padding-bottom:88px}
.topbar{height:68px;position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;background:#fffafde8;backdrop-filter:blur(18px)}
.brand{font-size:21px;font-weight:850} .brand span{color:var(--accent)} .icon-btn{border:0;background:transparent;font-size:22px}
main{padding:8px 18px 30px} .greet h2{font-size:18px;margin:2px 0} .sub{font-size:12px;color:var(--muted)}
.date-strip{display:flex;gap:8px;overflow:auto;padding:10px 0 14px} .date{min-width:48px;text-align:center;padding:8px 5px;border-radius:18px;font-size:11px;color:#706775}
.date b{display:block;font-size:16px;margin-top:3px} .date.today{background:var(--accent);color:white;box-shadow:0 8px 22px #6d16782b}
.hero{background:linear-gradient(#f3ddff,#fff);border-radius:28px;box-shadow:var(--shadow);overflow:hidden} .hero img{width:100%;height:220px;object-fit:cover;display:block}
.cycle-card{position:relative;margin:-32px 22px 0;background:#fff;border-radius:18px;padding:13px;text-align:center;box-shadow:0 8px 20px #4e0f5b18}
.cycle-card strong{display:block;font-size:24px} .phase{font-size:12px;color:#655a68} .progress{height:7px;background:#f4dcea;border-radius:8px;margin:10px 20px}
.progress i{display:block;width:64%;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--pink),var(--accent))}
.prediction{margin:12px 14px;border-radius:17px;padding:13px;text-align:center;background:linear-gradient(90deg,#ffddeb,#efcdfb)} .prediction strong{font-size:20px}
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 14px 15px} .tile,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.tile{padding:11px 4px;text-align:center;font-size:11px;font-weight:700} .tile span{display:block;font-size:25px;margin-bottom:5px}
.section-title{font-size:20px;font-weight:850;margin:20px 2px 10px} .insight{background:#fff8d9;border-radius:20px;padding:16px;min-height:140px;position:relative}
.insight h3{font-size:19px;margin:0 0 8px;max-width:72%} .insight .flower{position:absolute;right:15px;bottom:12px;font-size:50px}
.tip{background:#fff;border-radius:14px;padding:12px;margin-top:8px;box-shadow:var(--shadow)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:78px;background:#fffffff2;backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #eee;z-index:12}
.bottom-nav button{border:0;background:transparent;color:#8a808c;font-size:21px} .bottom-nav small{display:block;font-size:10px;margin-top:3px} .bottom-nav .active{color:var(--accent)}
.fab{width:52px;height:52px;border-radius:50%!important;background:linear-gradient(145deg,var(--accent),var(--accent2))!important;color:#fff!important;font-size:29px!important;margin:auto}
.page-title{font-size:25px;font-weight:850;margin:6px 0 16px} .calendar-head{display:flex;align-items:center;justify-content:space-between} .cal{padding:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center} .dow{font-size:10px;color:#888} .cell{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:12px}
.period{background:var(--period)} .fertile{background:var(--fertile)} .ovu{background:var(--ovu);color:white} .today{background:var(--accent);color:white}
.legend{font-size:10px;color:#6f6670;margin-top:14px} .summary{padding:15px;margin-top:14px}
.loggrid{display:grid;grid-template-columns:1fr 1fr;gap:11px} .logtile{padding:19px 6px;text-align:center;font-size:12px;font-weight:700} .logtile span{display:block;font-size:28px;margin-bottom:6px}
textarea{width:100%;min-height:78px;border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;font:inherit}
.save{width:100%;border:0;border-radius:18px;padding:14px;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));font-weight:850}
.tabs{display:flex;gap:7px} .tabs button{flex:1;border:0;border-radius:15px;padding:8px;background:#fff} .tabs .on{background:var(--accent);color:white}
.metric{padding:15px;margin-top:11px} .metric strong{font-size:25px;display:block;margin:5px 0} .chart{height:130px;display:flex;align-items:end;gap:10px;margin-top:10px}
.bar{flex:1;border-radius:8px 8px 2px 2px;background:linear-gradient(#ff78a4,#a43ab5)} .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px} .stat{padding:13px} .stat strong{display:block;font-size:20px;margin-top:5px}
.symrow{display:flex;align-items:center;justify-content:space-between;padding:12px;margin:7px 0} .moodbars{display:flex;gap:10px;align-items:end;height:150px;padding:12px} .moodbars i{flex:1;border-radius:8px;height:var(--h);background:linear-gradient(#ff75ac,#9a67df)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .mood{padding:12px 4px;text-align:center;font-size:13px} .profile{text-align:center} .avatar{font-size:66px}
.quote{padding:14px;background:linear-gradient(90deg,#def6ea,#f7d9ff);border-radius:18px;margin:12px 0} .menu{display:grid;gap:8px} .row{padding:13px;text-align:left} .row span{float:right}
.history{padding:12px;margin-top:8px} .history button{float:right;border:0;border-radius:10px;background:#f4e7f5;padding:6px 9px;color:var(--accent);font-weight:700}
.modal{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center} .sheet{width:min(520px,100%);background:#fff;border-radius:26px 26px 0 0;padding:20px 18px 34px}
.sheet input{width:100%;padding:12px;border:1px solid #ddd;border-radius:13px;margin:6px 0 13px} .note{font-size:10px;color:#8d828f;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div id="shell">
<header class="topbar"><button class="icon-btn">☰</button><div class="brand">MyCycle <span>♥</span></div><button class="icon-btn">🔔</button></header>
<main id="app"></main>
<nav class="bottom-nav">
<button data-page="home" class="active">⌂<small>Home</small></button>
<button data-page="calendar">▣<small>Calendar</small></button>
<button data-page="log" class="fab">＋</button>
<button data-page="insights">⌁<small>Insights</small></button>
<button data-page="profile">♙<small>Profile</small></button>
</nav>
</div>

function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function sorted(){return [...state.periods].filter(x=>x&&x.start).sort((a,b)=>a.start.localeCompare(b.start))}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function avgCycle(){let p=sorted();if(p.length<2)return 28;let a=[];for(let i=1;i<p.length;i++){let n=days(p[i-1].start,p[i].start);if(n>=15&&n<=60)a.push(n)}return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):28}
function avgPeriod(){let a=sorted().filter(x=>x.end).map(x=>days(x.start,x.end)+1).filter(x=>x>0&&x<16);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):5}
function latest(){let p=sorted();return p[p.length-1]||null}
function cycleDay(){let l=latest();return l?Math.max(1,days(l.start,iso(today))+1):'—'}
function phase(){let d=Number(cycleDay());if(!d)return 'Start tracking';if(d<=5)return 'Menstrual phase';let o=avgCycle()-14;if(d<o)return 'Follicular phase';if(Math.abs(d-o)<=1)return 'Estimated ovulation';return 'Luteal phase'}
function nextPeriod(){let l=latest();if(!l)return null;let d=new Date(l.start+'T12:00:00');d.setDate(d.getDate()+avgCycle());return iso(d)}
function nextIn(){let np=nextPeriod();return np?Math.max(0,days(iso(today),np)):null}
function dateStrip(){let h='';for(let i=-3;i<=3;i++){let d=new Date(today);d.setDate(today.getDate()+i);h+=`<div class="date ${i===0?'today':''}">${d.toLocaleDateString('en',{weekday:'short'})}<b>${d.getDate()}</b></div>`}return h}
function home(){app.innerHTML=`<div class="greet"><h2>Good ${today.getHours()<12?'morning':today.getHours()<18?'afternoon':'evening'}! 🌸</h2><div class=sub>Your body is doing amazing.</div></div><div class=date-strip>${dateStrip()}</div>
<section class=hero><img src="${ART}"><div class=cycle-card><div>Cycle day</div><strong>${cycleDay()}</strong><div class=phase>${phase()} ⓘ</div><div class=progress><i></i></div></div>
<div class=prediction>🌼 ${latest()?'Next period in':'Smart predictions'} <strong>${latest()?nextIn()+' days':'Start tracking'}</strong><br><small>${latest()?'Based on your logged cycle history':'Log a period to begin predictions'}</small></div>
<div class=quick3><div class=tile id=periodQuick><span>🩸</span>Log period</div><div class=tile data-go="symptoms"><span>🌸</span>Log symptoms</div><div class=tile data-go="mood"><span>🙂</span>Log mood</div></div></section>
<div class=section-title>Today's insights</div><div class=insight><h3>☀️ Your energy may be changing today!</h3><p>Track how you feel to discover patterns that are personal to you.</p><div class=flower>🌷</div></div>
<div class=section-title>Quick tips</div><div class=tip>💧 Stay hydrated</div><div class=tip>🧘‍♀️ Light exercise</div><div class=tip>🥗 Eat iron-rich foods</div><div class=note>Theme accent changes automatically every month ✨</div>`;
bindDynamic();}
function calendar(){let y=today.getFullYear(),m=today.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),g='SMTWTFS'.split('').map(x=>`<div class=dow>${x}</div>`).join('');for(let i=0;i<first;i++)g+='<div></div>';for(let d=1;d<=count;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let c=d===today.getDate()?'today':'';state.periods.forEach(p=>{if(p.start&&p.end&&ds>=p.start&&ds<=p.end)c='period'});g+=`<div class="cell ${c}">${d}</div>`}app.innerHTML=`<div class=calendar-head><div class=page-title>Calendar</div><b>${today.toLocaleDateString('en',{month:'long',year:'numeric'})}</b></div><div class="card cal"><div class=grid>${g}</div><div class=legend>● Period　🟢 Fertile window　🟣 Ovulation　• Logged</div></div><div class="card summary">🗓️ <b>Period ${latest()?'in '+nextIn()+' days':'not predicted yet'}</b><br><small>Average cycle ${avgCycle()} days • calculated automatically</small></div>`}
const logItems=[['🩸','Period'],['🌸','Symptoms'],['🙂','Mood'],['🌙','Sleep'],['❤️','Sex'],['⚖️','Weight'],['🥤','Water'],['✏️','Notes']];
function log(){app.innerHTML=`<div class=page-title>Log today</div><div class=sub>${today.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})}</div><div class=section-title>What would you like to log?</div><div class=loggrid>${logItems.map(x=>`<div class="card logtile" data-log="${x[1]}"><span>${x[0]}</span>${x[1]}</div>`).join('')}</div><textarea id=note placeholder="Add a note… (optional)"></textarea><button class=save id=saveNote>Save</button>`;bindDynamic();}
function insights(){app.innerHTML=`<div class=page-title>Insights</div><div class=tabs><button class=on>Cycle</button><button data-go="symptoms">Symptoms</button><button data-go="mood">Mood</button></div><div class="card metric">Cycle length<strong>${avgCycle()} days</strong><small>Average from your logged cycles</small><div class=chart>${[45,72,54,80,87,65].map(v=>`<i class=bar style="height:${v}%"></i>`).join('')}</div></div><div class=stats><div class="card stat">Period length<strong>${avgPeriod()} days</strong></div><div class="card stat">Ovulation day<strong>Day ${Math.max(1,avgCycle()-14)}</strong></div></div><div class=section-title>Your patterns</div><div class="card metric">Bloating　●●●○○<br><br>Headache　●●○○○<br><br>Mood swings　●●●○○</div>`;bindDynamic();}
function symptoms(){let s=[['🌸','Bloating'],['🔥','Cramps'],['🧊','Headache'],['🌺','Acne'],['🩸','Breast tenderness'],['🧘‍♀️','Back pain']];app.innerHTML=`<div class=page-title>Symptoms</div><div class=tabs><button class=on>This cycle</button><button>History</button></div>${s.map(x=>`<div class="card symrow"><span>${x[0]} ${x[1]}</span><button data-quick="${x[1]}">●●○　›</button></div>`).join('')}<button class=save data-quick="Custom symptom">＋ Add symptom</button>`;bindDynamic();}
function mood(){app.innerHTML=`<div class=page-title>Mood</div><div class="card moodbars">${[65,88,55,72,91,60,78].map(v=>`<i style="--h:${v}%"></i>`).join('')}</div><div class=section-title>How are you feeling today?</div><div class=moods>${['🥰 Amazing','🙂 Good','😌 Okay','😔 Sad','😟 Anxious','😤 Irritable'].map(x=>`<button class="card mood" data-quick="${x}">${x}</button>`).join('')}</div><div class=quote>🌷 Small steps, big smiles! 💜</div>`;bindDynamic();}
function profile(){let p=sorted().slice().reverse();app.innerHTML=`<div class=profile><div class=avatar>👩🏻</div><div class=page-title>MyCycle 💜</div><div class=sub>Listening to my body.</div><div class=quote>🌿 “Every cycle is unique, and so are you.” 🌸</div></div><div class=menu><div class="card row">📊 My data <span>›</span></div><div class="card row">🔔 Reminders <span>›</span></div><div class="card row">☁️ Backup & Sync <span>›</span></div><div class="card row">🔐 Passcode / Face ID <span>›</span></div><div class="card row">🎨 Theme <span>Auto ›</span></div><div class="card row">ⓘ About <span>›</span></div></div><div class=section-title>Period history</div>${p.length?p.map(x=>`<div class="card history">${x.start} → ${x.end}<button data-edit="${x.start}">Edit</button></div>`).join(''):'<div class="card history">No periods logged yet.</div>'}<div class=note>Cycle length and period length are calculated automatically from your period history.</div>`;bindDynamic();}
function openPeriod(editStart=null){let p=editStart?state.periods.find(x=>x.start===editStart):{start:iso(today),end:iso(today)};document.body.insertAdjacentHTML('beforeend',`<div class=modal id=modal><div class=sheet><h2>${editStart?'Edit':'Log'} period 🩸</h2><label>Start date</label><input id=ps type=date value="${p.start}"><label>End date</label><input id=pe type=date value="${p.end}"><button class=save id=periodSave>Save period</button><p style="text-align:center" id=periodCancel>Cancel</p></div></div>`);document.querySelector('#periodSave').onclick=()=>savePeriod(editStart);document.querySelector('#periodCancel').onclick=()=>document.querySelector('#modal').remove();}
function savePeriod(editStart){let start=document.querySelector('#ps').value,end=document.querySelector('#pe').value;if(!start||!end)return alert('Choose both dates');if(end<start)return alert('End date must be after start date');let p={start,end};if(editStart){let i=state.periods.findIndex(x=>x.start===editStart);state.periods[i]=p}else state.periods.push(p);save();document.querySelector('#modal').remove();go('calendar')}
function quick(x){state.logs[x]=(state.logs[x]||0)+1;save();alert(x+' logged 💜')}
function saveNote(){state.logs.note=document.querySelector('#note').value;save();alert('Saved 💜')}
function bindDynamic(){
document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
document.querySelectorAll('[data-quick]').forEach(el=>el.onclick=()=>quick(el.dataset.quick));
document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openPeriod(el.dataset.edit));
document.querySelectorAll('[data-log]').forEach(el=>el.onclick=()=>{let x=el.dataset.log;if(x==='Period')openPeriod();else if(x==='Symptoms')go('symptoms');else if(x==='Mood')go('mood');else quick(x)});
let pq=document.querySelector('#periodQuick');if(pq)pq.onclick=()=>openPeriod();
let sn=document.querySelector('#saveNote');if(sn)sn.onclick=saveNote;
}
function go(page){({home,calendar,log,insights,symptoms,mood,profile}[page]||home)();document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
document.querySelectorAll('.bottom-nav button[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).finally(home); else home();
})();
</script>
</body>
</html>
