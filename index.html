<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#64106f">
<title>MyCycle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--brand:#6f177b;--brand2:#9f2db0;--pink:#ff4f7f;--teal:#1aa9ae;--bg:#fffafc;--card:#fff;--ink:#181318;--muted:#777078;--line:#ece5ea;--shadow:0 10px 28px #4b15360d}
*{box-sizing:border-box} html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f3f6;color:var(--ink)} button,input,select,textarea{font:inherit}
#shell{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:78px}
.top{height:64px;padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fffafcee;backdrop-filter:blur(18px);z-index:8}
.avatar{width:38px;height:38px;border-radius:50%;background:#d02684;display:grid;place-items:center;color:white;font-size:20px} .top-title{font-size:18px} .top-btn{border:0;background:transparent;font-size:24px}
main{padding:0 0 25px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 18px 12px;align-items:end}
.wday{text-align:center;font-size:11px;color:#777} .wday b{display:grid;place-items:center;margin:auto;width:45px;height:45px;border-radius:50%;font-size:18px;color:var(--teal)} .wday.today b{background:white;box-shadow:0 5px 20px #0000000c} .wday.period b{background:var(--pink);color:white} .wday.active b{background:#e6ddd7;color:#222}
.hero{min-height:570px;padding:28px 18px 16px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(#eaf8fb,#fff)} .hero.period-bg{background:linear-gradient(#fff0f4,#fff)} .hero.luteal-bg{background:linear-gradient(#fff2ea,#fff)}
.hero img{width:230px;height:200px;object-fit:cover;margin:35px auto 10px;display:block;border-radius:28px}
.hero h1{font-size:30px;margin:12px 0 6px} .hero h1.teal{color:var(--teal)} .hero h1.pink{color:var(--pink)} .hero p{font-size:16px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 12px 16px} .round-action{text-align:center;font-size:13px} .round-action button{width:66px;height:66px;border-radius:50%;border:0;background:white;box-shadow:var(--shadow);font-size:30px} .round-action.primary button{background:var(--pink);color:white}
.insights-block{padding:0 18px 12px} .section-title{font-size:22px;font-weight:800;margin:18px 0 12px} .cards-row{display:flex;gap:10px;overflow:auto;padding-bottom:6px} .ins-card{min-width:180px;height:185px;border:3px solid var(--pink);border-radius:18px;padding:14px;background:white;display:flex;flex-direction:column;justify-content:space-between} .ins-card:nth-child(2){background:#8ca8f1} .ins-card:nth-child(3){background:#b6e2e2} .ins-card h3{font-size:18px;margin:0} .ins-card .big-num{font-size:56px;font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:78px;background:#fffffff3;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(4,1fr);z-index:10} .bottom button{border:0;background:transparent;font-size:22px;color:#aaa} .bottom small{display:block;font-size:10px} .bottom .active{color:#111}
.calendar-page{padding:8px 18px 24px} .seg{display:flex;width:280px;margin:0 auto 15px;background:#ddd;border-radius:30px;padding:4px} .seg button{flex:1;border:0;border-radius:25px;padding:10px;background:transparent;font-weight:700} .seg .on{background:white}
.month-title{text-align:center;font-size:23px;font-weight:800;margin:20px 0} .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px 8px;text-align:center} .dow{font-size:11px;color:#888} .cell{height:44px;display:grid;place-items:center;border-radius:50%;font-size:17px} .cell.logged{background:var(--pink);color:#fff} .cell.predicted{border:3px dotted #ff6893;color:#ff6893} .cell.fertile{color:var(--teal)} .cell.ovulation{border:3px dotted var(--teal);color:var(--teal)} .cell.today{font-weight:800}
.edit-period{display:block;margin:25px auto 0;border:0;border-radius:28px;padding:12px 25px;background:var(--pink);color:white;font-weight:700}
.settings{padding:8px 18px 30px} .settings h1{text-align:center;font-size:25px} .register{background:#ef4148;color:white;padding:28px 20px;text-align:center;margin:0 -18px} .register button{border:0;background:white;border-radius:25px;padding:10px 26px;font-weight:700} .profile-circle{width:130px;height:130px;border-radius:50%;background:#d52582;margin:30px auto 15px;display:grid;place-items:center;font-size:50px;color:white} .experience{display:grid;grid-template-columns:1fr 1fr;gap:14px} .exp-card{background:white;border-radius:18px;padding:22px 12px;text-align:center;box-shadow:var(--shadow);min-height:150px} .exp-card.selected{outline:3px solid var(--pink)} .exp-card span{font-size:36px;display:block;margin-bottom:15px}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center} .sheet{width:min(520px,100%);background:white;border-radius:28px 28px 0 0;padding:20px 18px 32px;max-height:88vh;overflow:auto} .field{margin:12px 0} .field label{display:block;font-size:12px;color:#777;margin-bottom:6px} .field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:14px} .save{width:100%;border:0;border-radius:18px;padding:14px;background:linear-gradient(90deg,var(--brand),var(--brand2));color:white;font-weight:800;margin-top:10px}
.log-page{padding:10px 18px 30px} .log-page h1{font-size:25px} .loggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .logtile{background:white;border-radius:18px;padding:20px 8px;text-align:center;box-shadow:var(--shadow)} .logtile span{font-size:32px;display:block;margin-bottom:5px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:white;padding:10px 15px;border-radius:20px;z-index:30;font-size:12px}
</style>
</head>
<body>

<nav class="bottom">

<button data-page="log">＋<small>Log</small></button>
<button data-page="settings">◎<small>Profile</small></button>
</nav>
</div>

const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function periods(){return [...S.periods].filter(x=>x.start).sort((a,b)=>a.start.localeCompare(b.start))}
function avgCycle(){let p=periods();if(p.length<2)return 28;let a=[];for(let i=1;i<p.length;i++){let n=days(p[i-1].start,p[i].start);if(n>15&&n<60)a.push(n)}return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):28}
function avgPeriod(){let a=periods().filter(x=>x.end).map(x=>days(x.start,x.end)+1).filter(x=>x>0&&x<15);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):5}
function latest(){let p=periods();return p[p.length-1]||null}
function cycleDayFor(date=now){let l=latest();return l?Math.max(1,days(l.start,iso(date))+1):null}
function ovDay(){return Math.max(10,avgCycle()-14)}
function nextPeriodDate(){let l=latest();if(!l)return null;let d=new Date(l.start+'T12:00:00');d.setDate(d.getDate()+avgCycle());return iso(d)}
function status(date=now){let cd=cycleDayFor(date);if(!cd)return {type:'none',title:'Start tracking',sub:'Log your period to get cycle predictions'};if(cd<=avgPeriod())return {type:'period',title:`Period day ${cd}`,sub:'Track symptoms and how you feel today'};let ov=ovDay();if(Math.abs(cd-ov)<=1)return {type:'ovulation',title:`Ovulation ${cd===ov?'today':'in '+Math.abs(ov-cd)+' day'}`,sub:'Fertility may be higher around this time'};if(cd<ov)return {type:'fertile',title:`Ovulation in ${ov-cd} days`,sub:'Fertility may be increasing'};let np=nextPeriodDate();return {type:'luteal',title:`Period in ${np?Math.max(0,days(iso(date),np)):'—'} days`,sub:'Pregnancy chance may be lower now'}}
function weekStrip(){let h='';for(let i=-2;i<=4;i++){let d=new Date(now);d.setDate(now.getDate()+i);let ds=iso(d),cl='';S.periods.forEach(p=>{if(ds>=p.start&&ds<=p.end)cl='period'});if(i===0)cl+=' today';h+=`<div class="wday ${cl}">${d.toLocaleDateString('en',{weekday:'short'}).slice(0,1)}<b>${d.getDate()}</b></div>`}return h}
function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),1400)}

function calendar(){
topDate.textContent=''; let y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),g='SMTWTFS'.split('').map(x=>`<div class=dow>${x}</div>`).join('');for(let i=0;i<first;i++)g+='<div></div>';
let np=nextPeriodDate(), ov=latest()?(()=>{let d=new Date(latest().start+'T12:00:00');d.setDate(d.getDate()+ovDay()-1);return iso(d)})():null;
for(let d=1;d<=count;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,cl='';S.periods.forEach(p=>{if(ds>=p.start&&ds<=p.end)cl='logged'});if(np){for(let i=0;i<avgPeriod();i++){let q=new Date(np+'T12:00:00');q.setDate(q.getDate()+i);if(ds===iso(q)&&!cl)cl='predicted'}}if(ov&&ds===ov)cl='ovulation';else if(ov){let od=new Date(ov+'T12:00:00');let q=new Date(ds+'T12:00:00');if(Math.abs((q-od)/864e5)<=5&&!cl)cl='fertile'}if(ds===iso(now))cl+=' today';g+=`<div class="cell ${cl}">${d}</div>`}
app.innerHTML=`<div class=calendar-page><div class=seg><button class=on>Month</button><button>Year</button></div><div class=month-title>${now.toLocaleDateString('en',{month:'long'})}</div><div class=cal-grid>${g}</div><button class=edit-period data-action=period>Edit period dates</button></div>`;bind();}
function log(){
topDate.textContent='Log today'; let items=[['🩸','Period'],['🌸','Symptoms'],['🙂','Mood'],['🌙','Sleep'],['♡','Sex'],['⚖️','Weight'],['🥤','Water'],['✏️','Notes']];
app.innerHTML=`<div class=log-page><h1>What would you like to log?</h1><div class=loggrid>${items.map(x=>`<button class=logtile data-log="${x[1]}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div></div>`;bind();}
function insights(){
topDate.textContent='Insights';app.innerHTML=`<div class=log-page><h1>Your cycle insights</h1><div class=loggrid><div class=logtile><span>🗓️</span>Average cycle<br><b>${avgCycle()} days</b></div><div class=logtile><span>🩸</span>Average period<br><b>${avgPeriod()} days</b></div><div class=logtile><span>🌼</span>Ovulation<br><b>Day ${ovDay()}</b></div><div class=logtile><span>◔</span>Cycle day<br><b>${cycleDayFor()||'—'}</b></div></div></div>`}
function settings(){
topDate.textContent='Settings';app.innerHTML=`<div class=settings><div class=register>Register to save your data, or use MyCycle locally on this device.<br><br><button data-quick="Account">Continue</button></div><div class=profile-circle>🐑</div><h2 style="text-align:center">Create free account</h2><button style="display:block;margin:0 auto 28px;border:0;border-radius:25px;padding:10px 24px">View profile</button><h2>Your MyCycle experience</h2><div class=experience>
<button class="exp-card ${S.experience==='track'?'selected':''}" data-exp=track><span>◔</span>Track cycle</button>
<button class="exp-card ${S.experience==='pregnant'?'selected':''}" data-exp=pregnant><span>◉</span>Get pregnant</button>
<button class="exp-card ${S.experience==='pregnancy'?'selected':''}" data-exp=pregnancy><span>♡</span>Track pregnancy</button>
<button class="exp-card ${S.experience==='peri'?'selected':''}" data-exp=peri><span>◌</span>Track perimenopause</button></div></div>`;bind();}
function openPeriod(){
let p=latest()||{start:iso(now),end:iso(now)};document.body.insertAdjacentHTML('beforeend',`<div class=sheet-bg id=sheet><div class=sheet><h2>${latest()?'Edit':'Log'} period dates</h2><div class=field><label>Start date</label><input id=ps type=date value="${p.start}"></div><div class=field><label>End date</label><input id=pe type=date value="${p.end}"></div><button class=save id=periodSave>Save</button><p style="text-align:center" id=cancelSheet>Cancel</p></div></div>`);periodSave.onclick=()=>{let a=ps.value,b=pe.value;if(!a||!b||b<a)return alert('Choose valid dates');if(latest()){let i=S.periods.findIndex(x=>x.start===latest().start);S.periods[i]={start:a,end:b}}else S.periods.push({start:a,end:b});save();sheet.remove();home();toast('Period saved')};cancelSheet.onclick=()=>sheet.remove();}
function bind(){
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(x.dataset.page));
document.querySelectorAll('[data-action=period]').forEach(x=>x.onclick=openPeriod);
document.querySelectorAll('[data-quick]').forEach(x=>x.onclick=()=>{S.logs[x.dataset.quick]=(S.logs[x.dataset.quick]||0)+1;save();toast(x.dataset.quick+' saved')});
document.querySelectorAll('[data-log]').forEach(x=>x.onclick=()=>{let k=x.dataset.log;if(k==='Period')openPeriod();else{S.logs[k]=(S.logs[k]||0)+1;save();toast(k+' logged')}});
document.querySelectorAll('[data-exp]').forEach(x=>x.onclick=()=>{S.experience=x.dataset.exp;save();settings()});
}
function go(p){({home,calendar,log,insights,settings}[p]||home)();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
document.querySelectorAll('.bottom button[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
settingsBtn.onclick=()=>go('settings');calBtn.onclick=()=>go('calendar');home();
})();
</script>
</body>
</html>
